[package]
name = "vhf_model"
version = "0.1.0"
edition = "2021"

[lib]
name = "evdmodel"
crate-type = ["cdylib", "rlib"]

[lints.rust]
warnings = "deny"

[dependencies]
ixa = "3.0.0"
csv = "1.3.1"
rand = "0.10.2"
tempfile = "3.19.1"
statrs = "0.19.0"
serde = "1.0.217"
ordered-float = { version = "4.6.0", features = ["serde"] }
num-traits = "0.2"
serde_json = "1.0.140"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
anyhow = "1"
chrono = "0.4.45"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "projection"
harness = false

[[bench]]
name = "contact_tracing"
harness = false
